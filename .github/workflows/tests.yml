name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests (Windows i686)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      # The workspace is a 32-bit Windows tool; this also verifies every
      # production crate with the target configured in .cargo/config.toml.
      - name: Check workspace
        run: cargo check --workspace

      # These integration tests generate all of their own inputs and can run
      # from the public checkout. Other tests intentionally require private
      # game data and development scripts, so they are not suitable for CI.
      - name: Run public Rust tests
        run: >-
          cargo test -p higanr_build_res --lib;
          cargo test -p higanr_core
          --test alloc_check
          --test learn_path
          --test ipv6_path
          --test rollback_sim
          --test spectate_model
          --test pacing_sum_cli
          --test replay_mark_cmp_cli
          --test replay_playcheck_cli
          --test pred_eval_cli
          --test replay_inputs_cli
